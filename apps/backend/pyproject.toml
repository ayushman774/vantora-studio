[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantora-studio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["migrations", "migrations.*", "tests", "tests.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
